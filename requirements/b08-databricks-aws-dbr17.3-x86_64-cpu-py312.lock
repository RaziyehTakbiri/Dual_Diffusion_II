# Fully transitive third-party wheel lock for the conventional B08 Databricks
# verification route.
#
# Target: CPython 3.12, Linux x86_64, glibc >= 2.28 (DBR 17.3 / Ubuntu 24.04).
# Resolved 2026-09-04 from PyPI, with only torch obtained from the official
# PyTorch CPU wheel index. Every line binds the one selected target wheel.
#
# This lock deliberately does not contain heterodiff itself. Build exactly one
# heterodiff wheel from the separately checked-in content-addressed source
# manifest, record the source-manifest and wheel SHA-256 values together in the
# runtime evidence, verify the digest, then install the project wheel separately
# with --no-deps.
#
# The project uses `pip wheel --no-deps --no-build-isolation`; therefore the
# separate `build` frontend is not required. pip, setuptools, and wheel are
# included as the exact bootstrap/build toolchain, while pytest and pyflakes
# are included for verification.

--index-url https://pypi.org/simple
--extra-index-url https://download.pytorch.org/whl/cpu
--only-binary :all:
--require-hashes

