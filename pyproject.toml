[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heterodiff"
version = "0.1.0"
description = "Research infrastructure for heterogeneous marked event diffusion"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "HeteroDiff contributors"}]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.9",
]

[project.scripts]
heterodiff-maestro-evidence = "heterodiff.data.maestro_evidence:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pyflakes>=2.4",
]
reference = [
  "torch>=2.12.1,<2.13",
  "threadpoolctl==3.6.0",
]
midi-validation = [
  "mido==1.3.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
